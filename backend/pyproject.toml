[project]
name = "signalsentry-api"
version = "1.0.0"
requires-python = ">=3.10"
# Vercel prefers pyproject.toml over requirements.txt when both exist.
# Keep this list aligned with requirements.txt (local pip still uses that file).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scapy>=2.6.0",
    "joblib>=1.4.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python bake_demo_db.py"
